<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ERP</title>
    <script>
      // Apply the saved theme before the first paint (no flash). Storage may be unavailable.
      try {
        if (localStorage.getItem('erp.theme') === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {
        /* default light */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
