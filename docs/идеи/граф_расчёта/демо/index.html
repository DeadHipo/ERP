<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Граф расчёта роялти: демо</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --line: #e2e5ea; --text: #1d2430; --muted: #6b7380;
    --b: #2f8a57; --b-bg: #e8f5ec; --c: #c4453a; --c-bg: #fbeceb; --ours: #4f6f94; --ours-bg: #e9eff6;
    --neutral: #9aa3ae; --accent: #2d5fa8; --warn: #b7791f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
         color: var(--text); background: var(--bg); }
  .app { display: grid; grid-template-columns: 270px 1fr; min-height: 100vh; }
  aside.cases { background: var(--panel); border-right: 1px solid var(--line); padding: 16px 0; overflow-y: auto; max-height: 100vh; position: sticky; top: 0; }
  aside.cases h1 { font-size: 15px; margin: 0 16px 4px; }
  aside.cases .sub { color: var(--muted); font-size: 12px; margin: 0 16px 12px; }
  .case-item { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 16px; cursor: pointer;
               border-left: 3px solid transparent; font: inherit; color: inherit; }
  .case-item:hover { background: #f1f3f6; }
  .case-item.active { background: #eaf0f9; border-left-color: var(--accent); }
  .case-item .cid { font-weight: 600; margin-right: 6px; }
  .case-item .meta { display: block; color: var(--muted); font-size: 11.5px; margin-top: 2px; }
  .lvl { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 8px; margin-left: 4px; vertical-align: 1px; }
  .lvl-простой { background: #e8f5ec; color: #2f6b47; }
  .lvl-средний { background: #fdf3e1; color: #8a5a12; }
  .lvl-сложный { background: #fbeceb; color: #93352d; }
  main { padding: 20px 28px 40px; min-width: 0; }
  .note-today { display: inline-block; background: #fff8e6; border: 1px solid #f1dfb0; color: #7a5b13; padding: 3px 10px;
                border-radius: 6px; font-size: 12.5px; }
  .fallback-note { color: var(--warn); font-size: 12.5px; margin-left: 8px; }
  h2.case-title { margin: 10px 0 4px; font-size: 20px; }
  .case-desc { margin: 0 0 8px; max-width: 900px; }
  .unit-key { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--muted); }
  .toolbar { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin: 14px 0 12px; }
  .tabs, .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
  .tabs button, .seg button { border: 0; background: none; padding: 6px 14px; cursor: pointer; font: inherit; color: var(--text); }
  .tabs button + button, .seg button + button { border-left: 1px solid var(--line); }
  .tabs button.on, .seg button.on { background: var(--accent); color: #fff; }
  .workspace { display: block; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .trackflow + .trackflow { margin-top: 16px; }
  .tf-head { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; margin-bottom: 8px; }
  .tf-head b { font-size: 14px; }
  .banner { padding: 6px 10px; border-radius: 6px; font-size: 12.5px; margin: 6px 0; }
  .banner.neg { background: #f3f0fb; color: #4b3b7a; }
  .banner.status { background: #fdf3e1; color: #7a5b13; }
  .graph-wrap { overflow-x: auto; }
  svg.graph { display: block; }
  svg.graph text { font-family: inherit; }
  .edge { cursor: pointer; }
  .edge .hit { stroke: transparent; fill: none; }
  .edge:hover .vis, .edge.sel .vis { stroke-opacity: 1; filter: drop-shadow(0 0 1px rgba(0,0,0,.35)); }
  .edge .vis { fill: none; stroke-opacity: .72; }
  .edge-label { font-size: 11px; paint-order: stroke; stroke: #fff; stroke-width: 3px; stroke-linejoin: round; fill: #2a313c; }
  .edge-label.rem { fill: #55606d; }
  .node rect { stroke: #c9ced6; }
  .node { cursor: pointer; }
  .node .nl { font-size: 12.5px; font-weight: 600; fill: #1d2430; }
  .node .nv { font-size: 11px; fill: #5b6370; }
  .node .warn { font-size: 11px; fill: var(--warn); paint-order: stroke; stroke: #fff; stroke-width: 3px; stroke-linejoin: round; }
  .legend { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; font-size: 12.5px; color: #3c4450; margin-top: 12px; }
  .legend .sw { display: inline-block; width: 26px; height: 0; border-top: 4px solid; vertical-align: middle; margin-right: 6px; }
  .legend .sw.dash { border-top-style: dashed; border-top-width: 3px; }
  .detail h3 { margin: 0 0 8px; font-size: 14px; }
  .detail dl { margin: 0; display: grid; grid-template-columns: 96px 1fr; gap: 4px 10px; font-size: 12.5px; }
  .detail dt { color: var(--muted); }
  .detail dd { margin: 0; word-break: break-word; }
  .detail .formula { margin-top: 10px; padding: 8px; background: #f6f7f9; border-radius: 6px; font-size: 12px;
                     font-family: ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; }
  .detail .empty { color: var(--muted); font-size: 12.5px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .cat { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 8px; font-weight: 600; }
  .cat-B { background: var(--b-bg); color: var(--b); }
  .cat-C { background: var(--c-bg); color: var(--c); }
  .cat-ours { background: var(--ours-bg); color: var(--ours); }
  /* таблица-дерево */
  .tree { font-size: 13px; }
  .trow { display: grid; grid-template-columns: minmax(190px, 1.8fr) 90px 130px 52px 44px 86px 56px minmax(170px, 1.6fr);
          gap: 6px; min-width: 860px; align-items: center; padding: 5px 4px; border-bottom: 1px solid #eef0f3; }
  .trow.head { font-size: 11.5px; color: var(--muted); border-bottom: 1px solid var(--line); }
  .trow.nodehdr { background: #f8f9fb; font-weight: 600; }
  .trow.edgerow { cursor: pointer; }
  .trow.edgerow:hover, .trow.edgerow.sel { background: #eef3fb; }
  .tog { border: 0; background: none; cursor: pointer; width: 18px; padding: 0; color: var(--muted); font: inherit; }
  .seeabove { color: var(--muted); font-weight: 400; font-size: 12px; }
  table.plain { border-collapse: collapse; width: 100%; font-size: 13px; }
  table.plain th, table.plain td { border-bottom: 1px solid #eef0f3; padding: 6px 8px; text-align: left; vertical-align: top; }
  table.plain th { font-size: 11.5px; color: var(--muted); font-weight: 600; }
  table.plain tfoot td { font-weight: 600; border-top: 1px solid var(--line); }
  .fields { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; color: #3c4450; }
  .sec-title { font-size: 13px; font-weight: 600; margin: 18px 0 8px; }
  details.trace { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; margin: 6px 0; background: #fbfcfd; }
  details.trace summary { cursor: pointer; font-size: 13px; }
  .checks { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 10px 22px; font-size: 13px; }
  .chk { display: inline-flex; align-items: center; gap: 6px; }
  .chk .box { width: 16px; height: 16px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center;
              color: #fff; font-size: 11px; font-weight: 700; }
  .chk.ok .box { background: var(--b); }
  .chk.bad .box { background: var(--c); }
  .chk.bad { color: var(--c); }
  .footnote { color: var(--muted); font-size: 12px; margin-top: 10px; max-width: 900px; }
  .empty-state { padding: 30px; text-align: center; color: var(--muted); }
  .detail.card { position: fixed; right: 18px; bottom: 18px; width: 330px; max-height: 70vh; overflow-y: auto;
                 box-shadow: 0 6px 24px rgba(20,30,50,.16); z-index: 5; }
  .detail .close { float: right; border: 0; background: none; cursor: pointer; font-size: 16px; color: var(--muted); }
  .hint { color: var(--muted); font-size: 12.5px; }
  .tree-wrap { overflow-x: auto; }
  @media print { aside.cases, .toolbar, .detail { display: none; } .app { display: block; } }
</style>
</head>
<body>
<div class="app">
  <aside class="cases" id="caseList"></aside>
  <main id="main"></main>
</div>

<script>
/* Запасные данные: используются, только если cases.js не загрузился (window.CASES не определён).
   Суммы посчитаны вручную по README §5 (12 знаков, остаток вычитанием). Схема: СХЕМА.md. */
(function () {
  function E(from, to, amount, kind, ruleId, documentId, percent, base, category, reason, assumption) {
    return { from: from, to: to, amount: amount, kind: kind, ruleId: ruleId, documentId: documentId,
             percent: percent, base: base, category: category, reason: reason, assumption: assumption };
  }
  function N(id, label, column, inA, outA, notes, remainderTo) {
    var n = { id: id, label: label, column: column, in: inA, out: outA, notes: notes || [] };
    if (remainderTo) n.remainderTo = remainderTo;
    return n;
  }
  var OK = { nodeBalance: true, sinksEqualNet: true, edgesEqualAllocations: true, signOk: true };
  function U(upc, net) {
    return { isrc: 'XX0000000001', upc: upc, reportingMonth: '2026-09', salesMonth: '2026-07',
             labelName: 'Label S', account: 'acc1', net: net };
  }
  function key(u) { return u.upc + '|' + u.salesMonth + '|' + u.labelName + '|' + u.account; }
  function unitInput(u) {
    return { kind: 'unit', id: key(u), summary: 'юнит ' + u.upc + ', net ' + u.net,
             fields: { isrc: u.isrc, upc: u.upc, reportingMonth: u.reportingMonth, salesMonth: u.salesMonth,
                       labelName: u.labelName, account: u.account, net: u.net }, node: 'perimeter' };
  }

  /* --- EX100: пример README §5 --- */
  var u100 = U('000000000001', '100.000000000000');
  var ex100 = {
    id: 'EX100', title: 'Пример README §5: всё на 100,00', level: 'сложный', source: 'docs/идеи/граф_расчёта/README.md §5',
    description: 'Ремиксер R 10 % off-the-top; сплит A 40 / B 20 от scaledNet; MC 5 % от net из пула; A&R 15 % от доли ' +
      'лейбла; саблейбл S 50 % от остатка доли лейбла. Цель MC считается от net (5), а не от scaledNet; саблейбл берёт ' +
      '50 % от 30,60 после A&R. Порядок «доля лейбла / саблейбл» — допущение Q11.',
    units: [{
      unitKey: key(u100), unit: u100, status: 'allocated', scheme: 'master/standard',
      nodes: [
        N('net', 'net', 0, '100.000000000000', '100.000000000000', [], 'scaledNet'),
        N('scaledNet', 'после top', 1, '90.000000000000', '90.000000000000', [], 'labelShare'),
        N('row:A', 'строка A', 2, '36.000000000000', '36.000000000000', [], 'artist:A'),
        N('row:B', 'строка B', 2, '18.000000000000', '18.000000000000', [], 'artist:B'),
        N('pool', 'пул', 2, '5.000000000000', '5.000000000000', []),
        N('labelShare', 'доля лейбла', 3, '36.000000000000', '36.000000000000', [], 'ours'),
        N('artist:R', 'R', 4, '10.000000000000', '10.000000000000'),
        N('artist:A', 'A', 4, '32.666666666667', '32.666666666667'),
        N('artist:B', 'B', 4, '16.333333333333', '16.333333333333'),
        N('artist:MC', 'MC', 4, '5.000000000000', '5.000000000000'),
        N('artist:AR', 'AR', 4, '5.400000000000', '5.400000000000'),
        N('artist:S', 'S', 4, '15.300000000000', '15.300000000000'),
        N('ours', 'наша доля', 4, '15.300000000000', '15.300000000000')
      ],
      edges: [
        E('net', 'artist:R', '10.000000000000', 'top', 'p1', 'd1', '10', '100.000000000000', 'B', null, null),
        E('scaledNet', 'row:A', '36.000000000000', 'row', 's1', 'd2', '40', '90.000000000000', null, null, null),
        E('scaledNet', 'row:B', '18.000000000000', 'row', 's1', 'd2', '20', '90.000000000000', null, null, null),
        E('row:A', 'pool', '3.333333333333', 'draw', 'p2', null, null, '36.000000000000', null, null, null),
        E('row:B', 'pool', '1.666666666667', 'draw', 'p2', null, null, '18.000000000000', null, null, null),
        E('pool', 'artist:MC', '5.000000000000', 'artist_pool', 'p2', 'd3', '5', '100.000000000000', 'B', null, null),
        E('labelShare', 'artist:AR', '5.400000000000', 'label_share', 'p3', 'd4', '15', '36.000000000000', 'C', 'assumption', 'q11'),
        E('labelShare', 'artist:S', '15.300000000000', 'sublabel', 'r1', 'd5', '50', '30.600000000000', 'C', 'assumption', 'q11'),
        E('row:A', 'artist:A', '32.666666666667', 'remainder', 's1', 'd2', null, null, 'B', null, null),
        E('row:B', 'artist:B', '16.333333333333', 'remainder', 's1', 'd2', null, null, 'B', null, null),
        E('scaledNet', 'labelShare', '36.000000000000', 'remainder', null, null, null, null, null, null, null),
        E('labelShare', 'ours', '15.300000000000', 'remainder', null, null, null, null, 'ours', null, null),
        E('net', 'scaledNet', '90.000000000000', 'remainder', null, null, null, null, null, null, null)
      ],
      trace: [
        { layer: 'label-of-record', scaledNet: '100.000000000000', labelShare: '0.000000000000', rows: [] },
        { layer: 'off-the-top', scaledNet: '90.000000000000', labelShare: '0.000000000000',
          rows: [{ artistId: 'R', kind: 'top', amount: '10.000000000000' }] },
        { layer: 'split', scaledNet: '90.000000000000', labelShare: '36.000000000000',
          rows: [{ artistId: 'R', kind: 'top', amount: '10.000000000000' }, { artistId: 'A', kind: 'row', amount: '36.000000000000' },
                 { artistId: 'B', kind: 'row', amount: '18.000000000000' }] },
        { layer: 'carve', scaledNet: '90.000000000000', labelShare: '30.600000000000',
          rows: [{ artistId: 'R', kind: 'top', amount: '10.000000000000' }, { artistId: 'A', kind: 'row', amount: '32.666666666667' },
                 { artistId: 'B', kind: 'row', amount: '16.333333333333' }, { artistId: 'MC', kind: 'artist_pool', amount: '5.000000000000' },
                 { artistId: 'AR', kind: 'label_share', amount: '5.400000000000' }] },
        { layer: 'sublabel', scaledNet: '90.000000000000', labelShare: '15.300000000000',
          rows: [{ artistId: 'R', kind: 'top', amount: '10.000000000000' }, { artistId: 'A', kind: 'row', amount: '32.666666666667' },
                 { artistId: 'B', kind: 'row', amount: '16.333333333333' }, { artistId: 'MC', kind: 'artist_pool', amount: '5.000000000000' },
                 { artistId: 'AR', kind: 'label_share', amount: '5.400000000000' }, { artistId: 'S', kind: 'sublabel', amount: '15.300000000000' }] }
      ],
      checks: OK
    }],
    inputs: [
      unitInput(u100),
      { kind: 'label', id: 'L-S', summary: 'строка «Label S» → саблейбл S, не наш лейбл',
        fields: { alias: 'Label S', labelId: 'L-S', ours: 'false' }, node: 'label-of-record' },
      { kind: 'label_rule', id: 'r1', summary: 'саблейбл S 50 % от остатка доли лейбла, документ d5',
        fields: { labelId: 'L-S', percent: '50', recipientArtistId: 'S', documentId: 'd5', validFrom: '2026-01-01', validTo: null }, node: 'sublabel' },
      { kind: 'participation', id: 'p1', summary: 'участие R 10 % (net, top), документ ok',
        fields: { artistId: 'R', percent: '10', base: 'net', fundedFrom: 'top', fromArtistId: null, documentId: 'd1', validFrom: '2026-01-01', validTo: null }, node: 'off-the-top' },
      { kind: 'split_row', id: 's1/A', summary: 'строка сплита A 40 %',
        fields: { splitId: 's1', artistId: 'A', percent: '40', documentId: 'd2', validFrom: '2026-01-01', validTo: null }, node: 'split' },
      { kind: 'split_row', id: 's1/B', summary: 'строка сплита B 20 %',
        fields: { splitId: 's1', artistId: 'B', percent: '20', documentId: 'd2', validFrom: '2026-01-01', validTo: null }, node: 'split' },
      { kind: 'participation', id: 'p2', summary: 'участие MC 5 % (net, artist_pool), документ ok',
        fields: { artistId: 'MC', percent: '5', base: 'net', fundedFrom: 'artist_pool', fromArtistId: null, documentId: 'd3', validFrom: '2026-01-01', validTo: null }, node: 'carve:pool' },
      { kind: 'participation', id: 'p3', summary: 'участие AR 15 % (доля лейбла, label_share), документ ok',
        fields: { artistId: 'AR', percent: '15', base: 'bucket', fundedFrom: 'label_share', fromArtistId: null, documentId: 'd4', validFrom: '2026-01-01', validTo: null }, node: 'carve:label_share' },
      { kind: 'document', id: 'd1…d5', summary: 'договоры, все утверждены',
        fields: { kind: 'contract', status: 'approved' }, node: 'categorise' }
    ]
  };

  /* --- G01: одна строка A 50 --- */
  function g01Unit(upc, net, half) {
    var u = U(upc, net);
    return {
      unitKey: key(u), unit: u, status: 'allocated', scheme: 'master/standard',
      nodes: [
        N('net', 'net', 0, net, net, [], 'scaledNet'),
        N('scaledNet', 'после top', 1, net, net, [], 'labelShare'),
        N('row:A', 'строка A', 2, half, half, [], 'artist:A'),
        N('labelShare', 'доля лейбла', 3, half, half, [], 'ours'),
        N('artist:A', 'A', 4, half, half),
        N('ours', 'наша доля', 4, half, half)
      ],
      edges: [
        E('scaledNet', 'row:A', half, 'row', 's1', 'd1', '50', net, null, null, null),
        E('row:A', 'artist:A', half, 'remainder', 's1', 'd1', null, null, 'B', null, null),
        E('scaledNet', 'labelShare', half, 'remainder', null, null, null, null, null, null, null),
        E('labelShare', 'ours', half, 'remainder', null, null, null, null, 'ours', null, null),
        E('net', 'scaledNet', net, 'remainder', null, null, null, null, null, null, null)
      ],
      trace: [
        { layer: 'label-of-record', scaledNet: net, labelShare: '0.000000000000', rows: [] },
        { layer: 'split', scaledNet: net, labelShare: half, rows: [{ artistId: 'A', kind: 'row', amount: half }] },
        { layer: 'sublabel', scaledNet: net, labelShare: half, rows: [{ artistId: 'A', kind: 'row', amount: half }] }
      ],
      checks: OK
    };
  }
  function g01Inputs(units) {
    return units.map(function (x) { return unitInput(x.unit); }).concat([
      { kind: 'label', id: 'L-S', summary: 'строка «Label S» → наш лейбл, саблейбла нет',
        fields: { alias: 'Label S', labelId: 'L-S', ours: 'true' }, node: 'label-of-record' },
      { kind: 'split_row', id: 's1/A', summary: 'строка сплита A 50 %, документ ok',
        fields: { splitId: 's1', artistId: 'A', percent: '50', documentId: 'd1', validFrom: '2026-01-01', validTo: null }, node: 'split' },
      { kind: 'document', id: 'd1', summary: 'договор A, утверждён', fields: { kind: 'contract', status: 'approved' }, node: 'categorise' }
    ]);
  }
  var g01u = [g01Unit('000000000001', '100.000000000000', '50.000000000000')];
  var g01 = { id: 'G01', title: 'Одна строка 50 %, остаток лейблу', level: 'простой', source: 'docs/agents/12_golden_cases.md G01',
    description: 'Юнит net 100, сплит из одной строки A 50 %. A получает 50 (B), остаток доли лейбла 50 — наша доля. ' +
      'Внутренние остатки показаны всегда, даже когда правил нет (net → после top целиком).',
    units: g01u, inputs: g01Inputs(g01u) };

  /* --- G24-mini: трек-месяц из двух юнитов --- */
  var g24u = [g01Unit('000000000001', '100.000000000000', '50.000000000000'),
              g01Unit('000000000002', '50.000000000000', '25.000000000000')];
  var g24 = { id: 'G24mini', title: 'Трек-месяц из двух юнитов (мини)', level: 'средний', source: 'запасной кейс по образцу G24',
    description: 'Тот же сплит A 50 % на двух UPC одного ISRC и месяца: net 100 и net 50. В режиме «сумма по трек-месяцу» ' +
      'одинаковые рёбра складываются: A 75, наша доля 75; раскрытие — по юниту.',
    units: g24u, inputs: g01Inputs(g24u) };

  /* --- EX-SF: недостача пула (README §5, второй пример) --- */
  var usf = U('000000000001', '100.000000000000');
  var exsf = { id: 'EXSF', title: 'Пул меньше цели: недостача', level: 'средний', source: 'docs/идеи/граф_расчёта/README.md §5 (недостача)',
    description: 'Сплит A 4 %, MC 5 % от net из пула. Пул = 4, цель 5: MC получает 4, строка A уходит в 0 (ребро-остаток ' +
      'показано нулём), у пула подпись «не хватило 1,00». Денег не создано: сумма стоков = 100.',
    units: [{
      unitKey: key(usf), unit: usf, status: 'allocated', scheme: 'master/standard',
      nodes: [
        N('net', 'net', 0, '100.000000000000', '100.000000000000', [], 'scaledNet'),
        N('scaledNet', 'после top', 1, '100.000000000000', '100.000000000000', [], 'labelShare'),
        N('row:A', 'строка A', 2, '4.000000000000', '4.000000000000', [], 'artist:A'),

    // легенда
    main.appendChild(h('div', { class: 'legend' }, [
      h('span', null, [h('span', { class: 'sw', style: 'border-color:' + COLORS.B }), 'B — подтверждено, можно платить']),
      h('span', null, [h('span', { class: 'sw', style: 'border-color:' + COLORS.C }), 'C — начислено, ждёт (причина текстом)']),
      h('span', null, [h('span', { class: 'sw', style: 'border-color:' + COLORS.ours }), 'наша доля']),
      h('span', null, [h('span', { class: 'sw', style: 'border-color:' + COLORS.neutral }), 'промежуточные корзины']),
      h('span', null, [h('span', { class: 'sw dash', style: 'border-color:#6b7380' }), 'пунктир — допущение (тоже C)']),
      h('span', null, [h('span', { style: 'color:var(--warn);margin-right:6px', text: '⚠' }), 'не хватило корзины (shortfall): деньги не создаются, цели уменьшены'])
    ]));
    main.appendChild(h('div', { class: 'footnote', text: 'Суммы показаны в центах (половина вверх); точное значение (12 знаков) — по наведению. ' +
      'Из-за округления сумма центов в узле может расходиться на 0,01 — расчёт ведётся точно. Остаток узла не берётся процентом: ' +
      'остаток = вход − Σ правил. Толщина ребра пропорциональна сумме.' }));

    // проверки
    var chk = h('div', { class: 'checks' });
    var labels = { nodeBalance: 'баланс узлов (вход = выход)', sinksEqualNet: 'Σ стоков = net', edgesEqualAllocations: 'рёбра = аллокации',
      signOk: 'знак рёбер = знак юнита' };
    var agg = { nodeBalance: true, sinksEqualNet: true, edgesEqualAllocations: true, signOk: true };
    units.forEach(function (u) { Object.keys(agg).forEach(function (k) { agg[k] = agg[k] && !!(u.checks && u.checks[k]); }); });
    var page = { nodeBalance: true, sinksEqualNet: true, signOk: true }, problems = [];
    units.forEach(function (u) { var r = verifyUnit(u); page.nodeBalance = page.nodeBalance && r.nodeBalance;
      page.sinksEqualNet = page.sinksEqualNet && r.sinksEqualNet; page.signOk = page.signOk && r.signOk; problems = problems.concat(r.problems); });
    function chkEl(ok, text, key) {
      return h('span', { class: 'chk ' + (ok ? 'ok' : 'bad'), 'data-check': key, 'data-ok': ok ? 'true' : 'false' },
        [h('span', { class: 'box', text: ok ? '✓' : '✕' }), text]);
    }
    chk.appendChild(h('b', { text: 'Проверка (из расчёта):' }));
    Object.keys(labels).forEach(function (k) { chk.appendChild(chkEl(agg[k], labels[k], k)); });
    main.appendChild(chk);
    var chk2 = h('div', { class: 'checks' }, [h('b', { text: 'Пересчёт на странице:' }),
      chkEl(page.nodeBalance, 'баланс узлов', 'page-nodeBalance'), chkEl(page.sinksEqualNet, 'Σ стоков = net', 'page-sinksEqualNet'),
      chkEl(page.signOk, 'знак', 'page-signOk')]);
    main.appendChild(chk2);
    if (problems.length) main.appendChild(h('div', { class: 'footnote', style: 'color:var(--c)', text: problems.join('; ') }));
  }

  function selectCase(id) {
    if (id !== state.caseId) { state.caseId = id; state.selected = null; state.mode = 'units'; }
    try { history.replaceState(null, '', '#' + encodeURIComponent(id)); } catch (err) { /* data:/file: без истории */ }
    render();
  }
  function fromHash() {
    var id = decodeURIComponent((location.hash || '').replace(/^#/, ''));
    var found = CASES.some(function (c) { return c.id === id; });
    var next = found ? id : (CASES[0] && CASES[0].id);
    if (next !== state.caseId) { state.caseId = next; state.selected = null; state.mode = 'units'; }
    render();
  }

  /* ===================== самотест (console.assert) ===================== */
  function selfTest() {
    var A = console.assert.bind(console), fails = 0;
    function check(cond, msg) { if (!cond) fails++; A(cond, msg); }
    check(fmtCents(toPico('-1234.567')) === '−1 234,57', 'формат центов −1 234,57');
    check(fmtCents(toPico('3.333333333333')) === '3,33', 'центы 3,33');
    check(fmtCents(toPico('0.005')) === '0,01', 'половина вверх');
    check(fmtCents(toPico('-0.001')) === '0,00', 'минус ноль не показывается');
    check(fmtFull(toPico('1234567.5')) === '1 234 567,500000000000', '12 знаков');
    check(picoToDec(toPico('3.333333333333') + toPico('1.666666666667')) === '5.000000000000', 'сложение через BigInt');
    check(picoToDec(toPico('-100')) === '-100.000000000000', 'отрицательная decimal-строка');
    var fb = window.CASES_FALLBACK || [];
    fb.forEach(function (c) {
      c.units.forEach(function (u) {
        var r = verifyUnit(u);
        check(r.nodeBalance && r.sinksEqualNet && r.signOk, 'запасной кейс ' + c.id + ' ' + u.unitKey + ': ' + r.problems.join('; '));
        // рёбра в artist:X = сумма аллокаций X в последнем слое трейса
        var last = u.trace[u.trace.length - 1], alloc = {};
        last.rows.forEach(function (row) { alloc['artist:' + row.artistId] = (alloc['artist:' + row.artistId] || 0n) + toPico(row.amount); });
        Object.keys(alloc).forEach(function (k) {
          var es = sumP(u.edges.filter(function (e) { return e.to === k; }).map(function (e) { return toPico(e.amount); }));
          check(es === alloc[k], c.id + ': рёбра в ' + k + ' = аллокация');
        });
      });
    });
    var g = fb.filter(function (c) { return c.units.length > 1; })[0];
    if (g) {
      var agg = aggregateUnits(g.units);
      var rr = verifyUnit(agg);
      check(rr.nodeBalance && rr.sinksEqualNet, 'агрегат сходится: ' + rr.problems.join('; '));
      var ea = agg.edges.filter(function (e) { return e.to === 'artist:A'; });
      check(ea.length === 1 && ea[0].amount === '75.000000000000' && ea[0].unitCount === 2, 'агрегат: artist:A 75 из 2 юнитов');
      check(agg.edges.length === g.units[0].edges.length, 'агрегат: одинаковые рёбра склеены');
      check(agg.unit.net === '150.000000000000', 'агрегат: net 150');
    }
    if (!usingFallback) CASES.forEach(function (c) {
      (c.units || []).forEach(function (u) { var r = verifyUnit(u); if (!(r.nodeBalance && r.sinksEqualNet && r.signOk)) console.warn('cases.js', c.id, r.problems); });
    });
    console.log('самотест демо: ' + (fails ? fails + ' ошибок' : 'всё сходится'));
    return fails;
  }

  window.__demo = { toPico: toPico, picoToDec: picoToDec, fmtCents: fmtCents, fmtFull: fmtFull, aggregateUnits: aggregateUnits,
    verifyUnit: verifyUnit, selfTest: selfTest };
  selfTest();
  if (typeof document !== 'undefined' && document.getElementById && document.getElementById('main')) {
    window.addEventListener('hashchange', fromHash);
    fromHash();
  }
})();
</script>
</body>
</html>
