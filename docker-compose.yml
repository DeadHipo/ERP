name: royalty-erp

services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    shm_size: 256mb
    stop_grace_period: 60s
    command: ['postgres', '-c', 'timezone=UTC', '-c', 'log_min_duration_statement=500']
    environment:
      TZ: ${TZ}
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      # с postgres 18 том монтируется в /var/lib/postgresql, PGDATA внутри версионируется
      - ${DATA_DIR:-./data}/postgres:/var/lib/postgresql
      - ./packages/backend/init/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U ${DB_USERNAME} -d ${DB_DATABASE}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    restart: unless-stopped
    stop_grace_period: 120s
    environment:
      TZ: ${TZ}
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE}
      CLICKHOUSE_USER: ${CLICKHOUSE_USERNAME}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - ${DATA_DIR:-./data}/clickhouse:/var/lib/clickhouse
      # монтируем один файл, а не папку: в config.d образа лежит docker_related_config.xml (listen на всех интерфейсах)
      - ./packages/backend/config/clickhouse/config.d/ops.xml:/etc/clickhouse-server/config.d/ops.xml:ro
      - ./packages/backend/init/clickhouse:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # Одноразовый сервис: применяет migrations/clickhouse/*.sql и завершается (код 0).
  # Приложению позже: depends_on: clickhouse-migrate: { condition: service_completed_successfully }
  clickhouse-migrate:
    image: node:24-alpine
    restart: 'no'
    working_dir: /app
    command: ['node', 'scripts/migrate-clickhouse.ts']
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: 8123 # порт внутри сети compose, не порт хоста из .env
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE}
      CLICKHOUSE_USERNAME: ${CLICKHOUSE_USERNAME}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      MIGRATIONS_DIR: /app/migrations/clickhouse
    volumes:
      - ./packages/backend/scripts/migrate-clickhouse.ts:/app/scripts/migrate-clickhouse.ts:ro
      - ./packages/backend/migrations/clickhouse:/app/migrations/clickhouse:ro
    depends_on:
      clickhouse:
        condition: service_healthy
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # Одноразовый сервис: применяет migrations/postgres/*.sql и завершается (код 0).
  # Вручную: docker compose -f docker-compose.yml -f docker-compose.dev.yml run --rm postgres-migrate [--status]
  postgres-migrate:
    image: postgres:18.6
    restart: 'no'
    entrypoint: ['bash', '/app/scripts/migrate-postgres.sh']
    environment:
      PGHOST: postgres
      PGPORT: 5432 # порт внутри сети compose, не порт хоста из .env
      PGDATABASE: ${DB_DATABASE}
      PGUSER: ${DB_USERNAME}
      PGPASSWORD: ${DB_PASSWORD}
      MIGRATIONS_DIR: /app/migrations/postgres
    volumes:
      - ./packages/backend/scripts/migrate-postgres.sh:/app/scripts/migrate-postgres.sh:ro
      - ./packages/backend/migrations/postgres:/app/migrations/postgres:ro
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
